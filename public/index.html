<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Wallit</title>
    <meta name="description" content="Cartões compartilhados sem confusão: quem compra registra, quem deve acompanha." />
    <meta name="theme-color" content="#155EEF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A3FB0" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Wallit" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #f5f7fb;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']),
        html:not([data-theme='light']) body {
          background-color: #0a1330;
        }
      }
      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background-color: #0a1330;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <script>
      // Paint the saved theme (Perfil > Aparência) before the app loads, so there is no flash.
      try {
        var theme = window.localStorage.getItem('wallit:theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    </script>
  </head>

  <body>
    <noscript>Ative o JavaScript para usar o Wallit.</noscript>
    <div id="root"></div>
  </body>
</html>
